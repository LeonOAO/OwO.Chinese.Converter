<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="./Assets/favico.ico" type="image/x-icon">
  <title>OwO 簡繁互轉｜小幫手</title>
  <style>
    :root { --bg:#f4f7fb; --panel:#fff; --text:#172033; --muted:#687386; --line:#dce3ee; --brand:#4f46e5; --brand2:#7c3aed; --ok:#087a55; --shadow:0 18px 48px rgba(31,41,55,.10); }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f1420; --panel:#171e2d; --text:#edf2ff; --muted:#9ba8bd; --line:#303b4e; --brand:#8b83ff; --brand2:#b779ff; --ok:#4adca8; --shadow:0 18px 52px rgba(0,0,0,.28); } }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif; color:var(--text); background:radial-gradient(circle at 10% 0%,rgba(79,70,229,.14),transparent 30%),var(--bg); }
    .app { width:min(1320px,96vw); margin:auto; padding:28px 0 34px; }
    header { display:flex; gap:18px; justify-content:space-between; align-items:end; margin-bottom:20px; }
    h1 { margin:0; font-size:clamp(25px,4vw,38px); letter-spacing:.02em; }
    header p { margin:7px 0 0; color:var(--muted); }
    .badge { flex:none; padding:8px 12px; border:1px solid var(--line); border-radius:999px; color:var(--ok); background:var(--panel); font-size:13px; }
    .toolbar,.settings,.editor { background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow); }
    .toolbar { padding:13px; border-radius:18px; display:flex; flex-wrap:wrap; gap:9px; align-items:center; }
    button,.file-btn,select,input { font:inherit; }
    button,.file-btn { border:1px solid var(--line); color:var(--text); background:var(--panel); border-radius:11px; padding:10px 14px; cursor:pointer; transition:.16s; }
    button:hover,.file-btn:hover { transform:translateY(-1px); border-color:var(--brand); }
    button.primary { color:#fff; border:0; background:linear-gradient(135deg,var(--brand),var(--brand2)); font-weight:700; }
    .spacer { flex:1; }
    .file-btn input { display:none; }
    .settings { margin-top:14px; padding:12px 14px; border-radius:16px; display:flex; flex-wrap:wrap; gap:18px; align-items:center; }
    label.inline { display:flex; gap:8px; align-items:center; color:var(--muted); }
    select { color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:7px 10px; }
    .switch { position:relative; width:42px; height:24px; }
    .switch input { opacity:0; width:0; height:0; }
    .slider { position:absolute; inset:0; background:#aeb7c6; border-radius:24px; cursor:pointer; }
    .slider:before { content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:white; border-radius:50%; transition:.2s; }
    .switch input:checked+.slider { background:var(--brand); }
    .switch input:checked+.slider:before { transform:translateX(18px); }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; }
    .editor { border-radius:18px; overflow:hidden; min-width:0; }
    .editor-head { padding:13px 15px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:10px; align-items:center; }
    .editor-head strong { font-size:17px; }
    .count { color:var(--muted); font-size:13px; white-space:nowrap; }
    textarea { width:100%; min-height:450px; padding:18px; border:0; outline:0; resize:vertical; color:var(--text); background:var(--panel); font:17px/1.75 "Microsoft JhengHei","Noto Sans TC",sans-serif; }
    textarea::placeholder { color:var(--muted); }
    .status { min-height:24px; padding:12px 4px 0; color:var(--muted); font-size:14px; }
    footer { margin-top:18px; color:var(--muted); font-size:13px; text-align:center; }
    dialog { width:min(760px,92vw); color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:0; box-shadow:var(--shadow); }
    dialog::backdrop { background:rgba(0,0,0,.45); }
    dialog header { padding:18px 20px 10px; margin:0; align-items:center; }
    dialog .body { padding:0 20px 18px; }
    dialog textarea { min-height:230px; border:1px solid var(--line); border-radius:12px; }
    .dialog-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
    @media(max-width:820px) { .app{padding-top:18px}.grid{grid-template-columns:1fr}textarea{min-height:310px}header{align-items:start}.badge{display:none}.toolbar button,.file-btn{flex:1 1 auto}.spacer{display:none} }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>OwO 簡繁互轉｜小幫手</h1><p>內建常用繁簡字形、台灣詞彙及可自行保存的自訂詞彙規則。</p></div>
    
  </header>

  <section class="toolbar" aria-label="主要工具列">
    <button id="convert" class="primary">立即轉換</button>
    <button id="swap">交換內容</button>
    <button id="paste">貼上</button>
    <button id="copy">複製結果</button>
    <button id="clear">全部清空</button>
    <span class="spacer"></span>
    <label class="file-btn">匯入 TXT<input id="file" type="file" accept=".txt,text/plain"></label>
    <button id="download">匯出 TXT</button>
    <button id="customBtn">自訂詞彙</button>
  </section>

  <section class="settings">
    <label class="inline">轉換方向
      <select id="direction">
        <option value="s2t">簡體 → 繁體（台灣用語）</option>
        <option value="t2s">繁體 → 簡體</option>
        <option value="auto">自動判斷</option>
      </select>
    </label>
    <label class="inline">即時轉換 <span class="switch"><input id="live" type="checkbox" checked><span class="slider"></span></span></label>
    <label class="inline">保留空白與換行 <span class="switch"><input id="spacing" type="checkbox" checked><span class="slider"></span></span></label>
  </section>

  <main class="grid">
    <section class="editor"><div class="editor-head"><strong>原始文字</strong><span id="sourceCount" class="count">0 字｜0 行</span></div><textarea id="source" autofocus placeholder="請貼上或輸入要轉換的文字……"></textarea></section>
    <section class="editor"><div class="editor-head"><strong>轉換結果</strong><span id="resultCount" class="count">0 字｜0 行</span></div><textarea id="result" placeholder="轉換結果會顯示在這裡……"></textarea></section>
  </main>
  <div id="status" class="status" role="status">準備完成。</div>
  
</div>

<dialog id="customDialog">
  <header><div><strong>自訂詞彙</strong><p>每行格式：簡體=繁體，例如：服务器=伺服器</p></div></header>
  <div class="body">
    <textarea id="customText" placeholder="服务器=伺服器&#10;软件=軟體"></textarea>
    <div class="dialog-actions"><button id="resetCustom">重設</button><button id="closeCustom">取消</button><button id="saveCustom" class="primary">儲存</button></div>
  </div>
</dialog>

const s2tChar = new Map(); const t2sChar = new Map();
for (let i=0;i<Math.min(sChars.length,tChars.length);i++) { s2tChar.set(sChars[i],tChars[i]); if(!t2sChar.has(tChars[i])) t2sChar.set(tChars[i],sChars[i]); }
const $ = id => document.getElementById(id);
const source=$('source'), result=$('result'), direction=$('direction'), status=$('status');
let timer;

function customPairs(){
  const raw=localStorage.getItem('owo_custom_pairs')||'';
  return raw.split(/\r?\n/).map(x=>x.split('=')).filter(x=>x.length>=2&&x[0]).map(([s,...r])=>[s,r.join('=')]);
}
function allPairs(){ return [...customPairs(),...phrasePairs].sort((a,b)=>b[0].length-a[0].length); }
function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function replacePairs(text,pairs,reverse=false){
  for(const pair of pairs){ const from=reverse?pair[1]:pair[0], to=reverse?pair[0]:pair[1]; if(from&&from!==to) text=text.replace(new RegExp(escapeRegExp(from),'g'),to); }
  return text;
}
function detect(text){ let s=0,t=0; for(const ch of text){ if(s2tChar.has(ch))s++; if(t2sChar.has(ch))t++; } return s>=t?'s2t':'t2s'; }
function transform(text,dir){
  const reverse=dir==='t2s';
  let out=replacePairs(text,allPairs(),reverse);
  const map=reverse?t2sChar:s2tChar;
  out=Array.from(out,ch=>map.get(ch)||ch).join('');
  if(!$('spacing').checked) out=out.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
  return out;
}
function counts(text){ return `${Array.from(text).length} 字｜${text?text.split(/\n/).length:0} 行`; }
function updateCounts(){ $('sourceCount').textContent=counts(source.value); $('resultCount').textContent=counts(result.value); }
function convert(show=true){
  let dir=direction.value; if(dir==='auto') dir=detect(source.value);
  result.value=transform(source.value,dir); updateCounts();
  if(show) status.textContent=`已完成${dir==='s2t'?'簡體轉繁體':'繁體轉簡體'}，共處理 ${Array.from(source.value).length} 個字元。`;
}
function live(){ updateCounts(); if(!$('live').checked)return; clearTimeout(timer); timer=setTimeout(()=>convert(false),120); }
source.addEventListener('input',live); result.addEventListener('input',updateCounts); direction.addEventListener('change',()=>convert()); $('spacing').addEventListener('change',()=>convert());
$('convert').onclick=()=>convert();
$('swap').onclick=()=>{ [source.value,result.value]=[result.value,source.value]; direction.value=direction.value==='s2t'?'t2s':direction.value==='t2s'?'s2t':'auto'; convert(); status.textContent='已交換左右內容。'; };
$('clear').onclick=()=>{ source.value='';result.value='';updateCounts();source.focus();status.textContent='已清空內容。'; };
$('paste').onclick=async()=>{ try{ source.value=await navigator.clipboard.readText();live();status.textContent='已從剪貼簿貼上。'; }catch{ source.focus(); status.textContent='瀏覽器未允許直接讀取剪貼簿，請按 Ctrl+V 貼上。'; } };
$('copy').onclick=async()=>{ if(!result.value){status.textContent='目前沒有可複製的結果。';return;} try{await navigator.clipboard.writeText(result.value);status.textContent='已複製轉換結果。';}catch{result.select();document.execCommand('copy');status.textContent='已複製轉換結果。';} };
$('file').onchange=async e=>{ const f=e.target.files[0];if(!f)return; source.value=await f.text();live();status.textContent=`已匯入 ${f.name}。`;e.target.value=''; };
$('download').onclick=()=>{ const text=result.value||source.value;if(!text){status.textContent='目前沒有可匯出的文字。';return;} const blob=new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='轉換結果.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status.textContent='已匯出 TXT。'; };
const dialog=$('customDialog'), customText=$('customText');
$('customBtn').onclick=()=>{customText.value=localStorage.getItem('owo_custom_pairs')||'';dialog.showModal();};
$('closeCustom').onclick=()=>dialog.close();
$('saveCustom').onclick=()=>{localStorage.setItem('owo_custom_pairs',customText.value.trim());dialog.close();convert();status.textContent='自訂詞彙已儲存在此瀏覽器。';};
$('resetCustom').onclick=()=>{customText.value='';localStorage.removeItem('owo_custom_pairs');};
dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close();});
updateCounts();
